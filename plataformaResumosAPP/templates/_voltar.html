{% comment %}
   Botão "Voltar" padrão. Fica sempre no topo da página, antes do título.

   Uso (o "as" guarda a URL numa variável para passar ao include):

       {% url 'dashboard_aluno' as url_voltar %}
       {% include '_voltar.html' with href=url_voltar texto='Voltar ao painel' %}
{% endcomment %}
<a href="{{ href }}" class="btn btn-light border btn-voltar">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    {{ texto }}
</a>
