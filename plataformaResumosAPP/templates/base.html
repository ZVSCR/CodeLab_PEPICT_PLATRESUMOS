{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Plataforma de Resumos{% endblock %}</title>

    <!-- 1. Bootstrap first (the foundation) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 2. Your custom CSS second (so it can override Bootstrap) -->
    <link rel="stylesheet" href="{% static 'plataformaResumosAPP/css/style.css' %}">
</head>
<body>

    <!-- Global messages: shows any messages.success/error from your views -->
    <div class="container mt-3">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-info">{{ message }}</div>
            {% endfor %}
        {% endif %}
    </div>

    <!-- The hole each page fills -->
    <main class="container my-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap JS (needed for interactive components like dropdowns/navbar toggle) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
